<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SoulNote — AI Emotional Diary{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-stone-200 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-semibold text-indigo-600 tracking-tight">
                SoulNote
            </a>
            <div class="space-x-4 text-sm font-medium text-slate-600">
                <a href="{% url 'home' %}" class="hover:text-indigo-600">Journal</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
