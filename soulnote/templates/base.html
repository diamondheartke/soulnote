<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SoulNote — AI Emotional Diary{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-stone-200 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-semibold text-indigo-600 tracking-tight">
                SoulNote
            </a>
            
            <div class="flex items-center space-x-6 text-sm font-medium text-slate-600">
                {% if user.is_authenticated %}
                    <a href="{% url 'home' %}" class="hover:text-indigo-600">Journal</a>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-red-600 hover:underline">Log Out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-indigo-600 font-medium hover:underline">Log In</a>
                    <a href="{% url 'register' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700 transition">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
