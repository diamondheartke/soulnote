{% extends "base.html" %}

{% block title %}Sign Up — SoulNote{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-stone-200 p-8 mt-10">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Create an Account</h1>
    <p class="text-slate-500 text-sm mb-6">Start journaling securely with SoulNote.</p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <!-- Render Django form fields cleanly -->
        {{ form.as_p }}

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition mt-4">
            Sign Up
        </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
        Already have an account? <a href="{% url 'login' %}" class="text-indigo-600 font-medium hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
